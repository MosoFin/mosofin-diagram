name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: mosofin/package-lock.json
      - name: Install renderer dependencies
        run: npm ci
        working-directory: mosofin
      - name: Golden-file + schema tests
        run: npm test
        working-directory: mosofin

  webm-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Provision a known Chrome runtime
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Install the WebM decoder
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Decode a real motion export and reject static frames
        run: npm run test:webm
        working-directory: mosofin
        env:
          MOSOFIN_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: Verify the real 1440x900 adaptive reader remains readable
        run: node --test test/desktop-reader-browser.test.mjs
        working-directory: mosofin
        env:
          MOSOFIN_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          MOSOFIN_CHROME_NO_SANDBOX: '1'
      - name: Verify all five diagram modes localize Viewer interactions
        run: node --test test/i18n.test.mjs
        working-directory: mosofin
        env:
          MOSOFIN_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          MOSOFIN_CHROME_NO_SANDBOX: '1'
      - name: Verify Semantic Radar collision and drag behavior
        run: node --test test/semantic-radar.test.mjs
        working-directory: mosofin
        env:
          MOSOFIN_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          MOSOFIN_CHROME_NO_SANDBOX: '1'
      - name: Verify Viewer chrome stays clear of SVG legends
        run: node --test test/viewer-chrome-layout.test.mjs
        working-directory: mosofin
        env:
          MOSOFIN_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          MOSOFIN_CHROME_NO_SANDBOX: '1'

  package-smoke:
    name: package smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build skill archive
        shell: bash
        run: scripts/build-zip.sh "$RUNNER_TEMP/mosofin.zip"
      - name: Extract packaged skill
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/mosofin-package"
          rm -rf "$package_root"
          mkdir -p "$package_root"
          unzip -q "$RUNNER_TEMP/mosofin.zip" -d "$package_root"
      - name: Extract packaged skill
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP 'mosofin-package'
          $archive = Join-Path $env:RUNNER_TEMP 'mosofin.zip'
          if (Test-Path $packageRoot) { Remove-Item -Recurse -Force $packageRoot }
          Expand-Archive -Path $archive -DestinationPath $packageRoot
      - name: Validate packaged skill without installing dependencies
        run: node scripts/package-smoke.mjs
