name: refresh zip

# Keeps mosofin.zip in step with the skill automatically.
#
# ci.yml already *verifies* the committed zip byte-for-byte (`zip-freshness`), but that gate only
# tells you the zip is stale after you have pushed. This workflow rebuilds and commits it for you
# whenever a file that ships inside the package changes, so the download on the default branch is
# always the current skill.
#
# Canonical bytes depend on the Node/zlib toolchain, so this pins Node 22 exactly as
# scripts/build-zip.sh requires and as ci.yml and release.yml use.

on:
  push:
    branches: [main]
    paths:
      - 'mosofin/**'
      - 'scripts/build-zip.sh'
      - 'scripts/write-deterministic-zip.mjs'
      - '.github/workflows/refresh-zip.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why you are rebuilding by hand'
        required: false
        default: 'manual refresh'

concurrency:
  group: refresh-zip-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Never re-trigger on this workflow's own commit.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          # A token that can push back to the branch.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild mosofin.zip
        run: scripts/build-zip.sh /tmp/fresh.zip

      - name: Compare with the committed zip
        id: compare
        run: |
          if cmp -s /tmp/fresh.zip mosofin.zip; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'mosofin.zip is already current.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'mosofin.zip is stale; committing the rebuild.'
          fi

      - name: Commit the refreshed zip
        if: steps.compare.outputs.changed == 'true'
        run: |
          cp /tmp/fresh.zip mosofin.zip
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mosofin.zip
          git commit -m 'chore: rebuild mosofin.zip for the current skill

          Generated by .github/workflows/refresh-zip.yml on Node 22.'
          git push

      - name: Summary
        run: |
          if [ '${{ steps.compare.outputs.changed }}' = 'true' ]; then
            echo '### mosofin.zip rebuilt and committed' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### mosofin.zip was already current — nothing to do' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "- size: $(wc -c < mosofin.zip) bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- sha256: $(sha256sum mosofin.zip | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
