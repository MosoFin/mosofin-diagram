<svg xmlns="http://www.w3.org/2000/svg" width="880" height="56" viewBox="0 0 880 56">
  <title>Default architecture legend catalogue</title>
  <desc>Every entry the architecture renderer can show (mode "all"), in catalogue order from render-architecture.mjs:82-90, with the default English labels from i18n.mjs legend.architecture.*. Authors override per artifact via meta.legend.entries[kind].label. Swatch colours are the classic light tokens.</desc>
  <rect width="880" height="56" fill="#ffffff"/>
  <text x="20" y="12" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="9" font-weight="650" fill="#0f172a">Legend · architecture · render-architecture.mjs:82-90</text>
    <g data-legend-kind="frontend" data-locale="en"><rect x="20" y="30" width="16" height="10" rx="2.5" fill="rgba(34, 211, 238, 0.15)" stroke="#0891b2" stroke-width="1"/><text x="44" y="39.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">Commerce</text></g>
    <g data-legend-kind="backend" data-locale="en"><rect x="140" y="30" width="16" height="10" rx="2.5" fill="rgba(52, 211, 153, 0.18)" stroke="#059669" stroke-width="1"/><text x="164" y="39.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">Payments</text></g>
    <g data-legend-kind="database" data-locale="en"><rect x="260" y="30" width="16" height="10" rx="2.5" fill="rgba(167, 139, 250, 0.2)" stroke="#7c3aed" stroke-width="1"/><text x="284" y="39.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">Ledger</text></g>
    <g data-legend-kind="cloud" data-locale="en"><rect x="380" y="30" width="16" height="10" rx="2.5" fill="rgba(251, 191, 36, 0.18)" stroke="#d97706" stroke-width="1"/><text x="404" y="39.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">Bank</text></g>
    <g data-legend-kind="security" data-locale="en"><rect x="500" y="30" width="16" height="10" rx="2.5" fill="rgba(251, 113, 133, 0.15)" stroke="#e11d48" stroke-width="1"/><text x="524" y="39.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">Control</text></g>
    <g data-legend-kind="messagebus" data-locale="en"><rect x="620" y="30" width="16" height="10" rx="2.5" fill="rgba(251, 146, 60, 0.15)" stroke="#ea580c" stroke-width="1"/><text x="644" y="39.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">Sync</text></g>
    <g data-legend-kind="external" data-locale="en"><rect x="740" y="30" width="16" height="10" rx="2.5" fill="rgba(148, 163, 184, 0.18)" stroke="#64748b" stroke-width="1"/><text x="764" y="39.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">Counterparty</text></g>
</svg>
