<svg xmlns="http://www.w3.org/2000/svg" width="640" height="76" viewBox="0 0 640 76">
  <title>Default dataflow legend catalogue (en row, zh-CN row)</title>
  <desc>Every entry the dataflow renderer can show (mode "all"), in catalogue order from render-dataflow.mjs:417-426, with the default labels from i18n.mjs legend.dataflow.*. Authors override per artifact via meta.legend.entries[kind].label. Swatch colours are the classic light tokens.</desc>
  <rect width="640" height="76" fill="#ffffff"/>
  <text x="20" y="12" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="9" font-weight="650" fill="#0f172a">Legend · dataflow · render-dataflow.mjs:417-426</text>
    <g data-legend-kind="emphasis" data-locale="en"><line x1="20" y1="26" x2="54" y2="26" stroke="#059669" stroke-width="1.8"/><polygon points="54,22.5 62,26 54,29.5" fill="#059669"/><text x="70" y="29.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">money</text></g>
    <g data-legend-kind="security" data-locale="en"><line x1="140" y1="26" x2="174" y2="26" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="5,5"/><polygon points="174,22.5 182,26 174,29.5" fill="#e11d48"/><text x="190" y="29.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">contra / deduction</text></g>
    <g data-legend-kind="dashed" data-locale="en"><line x1="260" y1="26" x2="294" y2="26" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,4"/><polygon points="294,22.5 302,26 294,29.5" fill="#7c3aed"/><text x="310" y="29.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">timing difference</text></g>
    <g data-legend-kind="database" data-locale="en"><rect x="380" y="20" width="16" height="10" rx="2.5" fill="rgba(167, 139, 250, 0.2)" stroke="#7c3aed" stroke-width="1"/><text x="404" y="29.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">account</text></g>
    <g data-legend-kind="default" data-locale="en"><line x1="500" y1="26" x2="534" y2="26" stroke="#94a3b8" stroke-width="1.2"/><polygon points="534,22.5 542,26 534,29.5" fill="#94a3b8"/><text x="550" y="29.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">sync</text></g>
    <g data-legend-kind="emphasis" data-locale="zh-CN"><line x1="20" y1="56" x2="54" y2="56" stroke="#059669" stroke-width="1.8"/><polygon points="54,52.5 62,56 54,59.5" fill="#059669"/><text x="70" y="59.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">资金</text></g>
    <g data-legend-kind="security" data-locale="zh-CN"><line x1="140" y1="56" x2="174" y2="56" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="5,5"/><polygon points="174,52.5 182,56 174,59.5" fill="#e11d48"/><text x="190" y="59.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">冲减 / 扣项</text></g>
    <g data-legend-kind="dashed" data-locale="zh-CN"><line x1="260" y1="56" x2="294" y2="56" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,4"/><polygon points="294,52.5 302,56 294,59.5" fill="#7c3aed"/><text x="310" y="59.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">时间性差异</text></g>
    <g data-legend-kind="database" data-locale="zh-CN"><rect x="380" y="50" width="16" height="10" rx="2.5" fill="rgba(167, 139, 250, 0.2)" stroke="#7c3aed" stroke-width="1"/><text x="404" y="59.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">账户</text></g>
    <g data-legend-kind="default" data-locale="zh-CN"><line x1="500" y1="56" x2="534" y2="56" stroke="#94a3b8" stroke-width="1.2"/><polygon points="534,52.5 542,56 534,59.5" fill="#94a3b8"/><text x="550" y="59.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">同步</text></g>
</svg>
