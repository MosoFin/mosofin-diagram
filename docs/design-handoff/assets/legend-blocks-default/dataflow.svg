<svg xmlns="http://www.w3.org/2000/svg" width="640" height="56" viewBox="0 0 640 56">
  <title>Default dataflow legend catalogue</title>
  <desc>Every entry the dataflow renderer can show (mode "all"), in catalogue order from render-dataflow.mjs:417-426, with the default English labels from i18n.mjs legend.dataflow.*. Authors override per artifact via meta.legend.entries[kind].label. Swatch colours are the classic light tokens.</desc>
  <rect width="640" height="56" fill="#ffffff"/>
  <text x="20" y="12" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="9" font-weight="650" fill="#0f172a">Legend · dataflow · render-dataflow.mjs:417-426</text>
    <g data-legend-kind="emphasis" data-locale="en"><line x1="20" y1="36" x2="54" y2="36" stroke="#059669" stroke-width="1.8"/><polygon points="54,32.5 62,36 54,39.5" fill="#059669"/><text x="70" y="39.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">money</text></g>
    <g data-legend-kind="security" data-locale="en"><line x1="140" y1="36" x2="174" y2="36" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="5,5"/><polygon points="174,32.5 182,36 174,39.5" fill="#e11d48"/><text x="190" y="39.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">contra / deduction</text></g>
    <g data-legend-kind="dashed" data-locale="en"><line x1="260" y1="36" x2="294" y2="36" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,4"/><polygon points="294,32.5 302,36 294,39.5" fill="#7c3aed"/><text x="310" y="39.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">timing difference</text></g>
    <g data-legend-kind="database" data-locale="en"><rect x="380" y="30" width="16" height="10" rx="2.5" fill="rgba(167, 139, 250, 0.2)" stroke="#7c3aed" stroke-width="1"/><text x="404" y="39.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">account</text></g>
    <g data-legend-kind="default" data-locale="en"><line x1="500" y1="36" x2="534" y2="36" stroke="#94a3b8" stroke-width="1.2"/><polygon points="534,32.5 542,36 534,39.5" fill="#94a3b8"/><text x="550" y="39.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">sync</text></g>
</svg>
