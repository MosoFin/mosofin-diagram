    <g data-legend-kind="messagebus" data-locale="zh-CN"><rect x="380" y="50" width="16" height="10" rx="2.5" fill="rgba(251, 146, 60, 0.15)" stroke="#ea580c" stroke-width="1"/><text x="404" y="59.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">银行</text></g>
