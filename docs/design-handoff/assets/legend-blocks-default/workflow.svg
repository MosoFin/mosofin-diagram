    <g data-legend-kind="external" data-locale="zh-CN"><rect x="740" y="50" width="16" height="10" rx="2.5" fill="rgba(148, 163, 184, 0.18)" stroke="#64748b" stroke-width="1"/><text x="764" y="59.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">往来方</text></g>
