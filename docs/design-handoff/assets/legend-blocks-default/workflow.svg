<svg xmlns="http://www.w3.org/2000/svg" width="880" height="76" viewBox="0 0 880 76">
  <title>Default workflow legend catalogue (en row, zh-CN row)</title>
  <desc>Every entry the workflow renderer can show (mode "all"), in catalogue order from render-workflow.mjs:680-688, with the default labels from i18n.mjs legend.workflow.*. Authors override per artifact via meta.legend.entries[kind].label. Swatch colours are the classic light tokens.</desc>
  <rect width="880" height="76" fill="#ffffff"/>
  <text x="20" y="12" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="9" font-weight="650" fill="#0f172a">Legend · workflow · render-workflow.mjs:680-688</text>
    <g data-legend-kind="frontend" data-locale="en"><rect x="20" y="20" width="16" height="10" rx="2.5" fill="rgba(34, 211, 238, 0.15)" stroke="#0891b2" stroke-width="1"/><text x="44" y="29.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">Commerce</text></g>
    <g data-legend-kind="backend" data-locale="en"><rect x="140" y="20" width="16" height="10" rx="2.5" fill="rgba(52, 211, 153, 0.18)" stroke="#059669" stroke-width="1"/><text x="164" y="29.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">Payments</text></g>
    <g data-legend-kind="security" data-locale="en"><rect x="260" y="20" width="16" height="10" rx="2.5" fill="rgba(251, 113, 133, 0.15)" stroke="#e11d48" stroke-width="1"/><text x="284" y="29.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">Control</text></g>
    <g data-legend-kind="messagebus" data-locale="en"><rect x="380" y="20" width="16" height="10" rx="2.5" fill="rgba(251, 146, 60, 0.15)" stroke="#ea580c" stroke-width="1"/><text x="404" y="29.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">Bank</text></g>
    <g data-legend-kind="database" data-locale="en"><rect x="500" y="20" width="16" height="10" rx="2.5" fill="rgba(167, 139, 250, 0.2)" stroke="#7c3aed" stroke-width="1"/><text x="524" y="29.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">Books</text></g>
    <g data-legend-kind="cloud" data-locale="en"><rect x="620" y="20" width="16" height="10" rx="2.5" fill="rgba(251, 191, 36, 0.18)" stroke="#d97706" stroke-width="1"/><text x="644" y="29.5" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#64748b">Platform</text></g>
