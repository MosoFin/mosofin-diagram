    <g data-legend-kind="database"><rect x="186" y="9" width="16" height="10" rx="2.5" fill="none" stroke="#7c3aed" stroke-width="1"></rect><text x="208" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b">Database</text></g>
