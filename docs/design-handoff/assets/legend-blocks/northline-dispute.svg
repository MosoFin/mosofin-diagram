<svg xmlns="http://www.w3.org/2000/svg" width="660" height="40" viewBox="0 0 660 40">
  <title>Legend as delivered for northline-dispute (unknown type)</title>
  <desc>Labels are the live strings from the delivered artifact, not defaults from source. Several are still Archify agent vocabulary.</desc>
  <rect width="660" height="40" fill="#ffffff"></rect>
  <g transform="translate(12 8)">
    <g data-legend-kind="start"><rect x="0" y="9" width="16" height="10" rx="2.5" fill="none" stroke="#0891b2" stroke-width="1"></rect><text x="22" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b">start</text></g>
    <g data-legend-kind="active"><rect x="78" y="9" width="16" height="10" rx="2.5" fill="none" stroke="#059669" stroke-width="1"></rect><text x="100" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b">active state</text></g>
    <g data-legend-kind="waiting"><rect x="198" y="9" width="16" height="10" rx="2.5" fill="none" stroke="#d97706" stroke-width="1"></rect><text x="220" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b">waiting</text></g>
    <g data-legend-kind="decision"><rect x="288" y="9" width="16" height="10" rx="2.5" fill="none" stroke="#7c3aed" stroke-width="1"></rect><text x="310" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b">decision</text></g>
    <g data-legend-kind="success"><rect x="384" y="9" width="16" height="10" rx="2.5" fill="none" stroke="#059669" stroke-width="1"></rect><text x="406" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b">terminal success</text></g>
    <g data-legend-kind="failure"><rect x="528" y="9" width="16" height="10" rx="2.5" fill="none" stroke="#dc2626" stroke-width="1"></rect><text x="550" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b">failure / exit</text></g>
  </g>
</svg>